name: Temporary Symfony patch security refresh

on:
  push:
    branches:
      - chore/symfony-security-refresh-2026-10
    paths:
      - ".github/workflows/temp-security-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_SECRET: temporary-ci-secret
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/security_refresh?serverVersion=17&charset=utf8"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, pdo_pgsql
          tools: composer:v2
      - name: Update supported Symfony 7.4 patches
        run: composer update "symfony/*" --with-all-dependencies --no-interaction --no-progress --no-scripts
      - name: Validate Composer files
        run: composer validate --no-check-publish
      - name: Lint YAML and container
        run: |
          php bin/console lint:yaml config/
          php bin/console lint:container --env=test
      - name: Commit refreshed lock for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already current"
          else
            git add composer.lock
            git commit -m "chore: refresh Symfony dependencies"
            git push origin HEAD
          fi
      - name: Require clean Composer security audit
        run: composer audit --locked
